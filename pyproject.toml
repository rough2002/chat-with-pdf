[project]
name = "chat-with-pdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "appwrite>=24.0.0",
    "fastapi[standard]>=0.142.0",
    "google>=3.0.0",
    "google-genai>=2.26.0",
    "langchain-text-splitters>=1.1.3",
    "pinecone>=10.0.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "supabase>=2.32.0",
]

[project.scripts]
chat-with-pdf = "chat_with_pdf:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
